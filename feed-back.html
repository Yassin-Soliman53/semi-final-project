<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="feed-back.css">
</head>
<body>
    <div class="form-form">
        <form class="feedback-form">
            <h2 class="form-title">Rate Us</h2>
            <div class="cont">
                <label for="firstname" class="form-label">first name:</label>
                <input type="text" id="fname" placeholder="e.g\Yassin" class="form-input">
            </div>

            <div class="cont">
                <label for="lastname" class="form-label">last name:</label>
                <input type="text" id="lname"placeholder="e.g\Soliman"class="form-input">
            </div>

            <div class="cont">
                <label for="feedback" class="form-label">your feedback</label>
                <textarea id="feedback" placeholder="Share your experience" class="form-textarea"></textarea>
            </div>
            <button type="submit" class="submit-btn">submit rating</button>
        </form> 
    </div>
</body>
</html>
