<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="feed-back.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-div">
            <ul class="nav-ul">
                <li style="color: aliceblue;" class="nav-li">
                    <a href="index.html">home</a>
                </li>
                <li style="color: aliceblue;" class="nav-li">
                    <a href="weather.html">weather</a>
                </li>
                <li style="color: aliceblue;" class="nav-li">

                <li style="color: aliceblue;" class="nav-li">
                    <a href="feed-back.html">feed-back</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="form-form">
        <form class="feedback-form" id="feedbackForm">
            <h2 class="form-title">Rate Us</h2>

            <div class="cont">
                <label for="fname" class="form-label">First Name:</label>
                <input type="text" id="fname" placeholder="e.g. Yassin" class="form-input" required>
            </div>

            <div class="cont">
                <label for="lname" class="form-label">Last Name:</label>
                <input type="text" id="lname" placeholder="e.g. Soliman" class="form-input" required>
            </div>

            <div class="cont">
                <label for="feedback" class="form-label">Your Feedback:</label>
                <textarea id="feedback" placeholder="Share your experience" class="form-textarea" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Submit Rating</button>
        </form> 
    </div>
    <script type="module" src="./feed-back.js"></script>
</body>
</html>
